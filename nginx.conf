server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite's hashed filenames (e.g. index-a1b2c3d4.js) change whenever content does, so it's safe
    # to cache them forever — a new deploy just gets new filenames, referenced by a fresh index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must always be revalidated, or browsers/proxies can keep serving a stale
    # shell that references assets from a previous build that no longer exist
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — unknown paths (e.g. a hard refresh on /batches/12) are handled client-side by
    # React Router, not by nginx, so always fall back to index.html instead of 404ing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
